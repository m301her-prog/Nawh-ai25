name: Daily Schema Cleanup (48 hours)

on:
  schedule:
    # يعمل تلقائياً يومياً الساعة 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call Clean API Endpoint
        run: |
          curl -X POST https://nawh-ai25.vercel.app/api/cron/cleanup-expired-schemas \
            -H "Content-Type: application/json" \
            -H "x-action-secret: MY_SECURE_CRON_SECRET_123" \
            -d '{
              "maxAgeHours": 48
            }'
