# 6. حقن ملفات الهوية والميزات وإعدادات الأمان
      - name: 6. Inject Firebase, App Identity, Ad Network & Security Config
        shell: bash
        run: |
          # حقن ملف جوجل وتعديل الـ package_name إلى المعرّف الخاص بنا
          cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "162488255991",
              "project_id": "raqqa-43dc8",
              "storage_bucket": "raqqa-43dc8.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:162488255991:android:73d6299f11a1b7aec61af2",
                  "android_client_info": { "package_name": "com.mydept.app" }
                },
                "api_key": [ { "current_key": "AIzaSyAKjsgnoHnGGr3urhm6Kpu7RvxN2dp6sJQ" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # ملفات الإعدادات
          STRINGS="android/app/src/main/res/values/strings.xml"
          APP_GRADLE="android/app/build.gradle"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # تعديل اسم التطبيق ليصبح (MY DEPT) والحزمة لـ (com.mydept.app)
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">MY DEPT<\/string>/' $STRINGS
          sed -i 's/namespace ".*"/namespace "com.mydept.app"/' $APP_GRADLE
          sed -i 's/applicationId ".*"/applicationId "com.mydept.app"/' $APP_GRADLE
          
          # 1. منع النسخ الاحتياطي (allowBackup=false) داخل وسم application
          sed -i 's/<application /&android:allowBackup="false" /' $MANIFEST

          # 2. إنشاء ملف أمان الشبكة لمنع اتصالات HTTP العادية وإجبارها على نطاق Vercel
          mkdir -p android/app/src/main/res/xml
          cat <<EOF > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="false">
                  <domain includeSubdomains="true">nawh-ai25.vercel.app</domain>
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </domain-config>
          </network-security-config>
          EOF

          # ربط ملف أمان الشبكة بملف الـ Manifest
          sed -i 's/<application /&android:networkSecurityConfig="@xml\/network_security_config" /' $MANIFEST

          # إضافة الأذونات اللازمة (الإنترنت، الإشعارات، التسجيل)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST

          # إضافة معرفات Start.io داخل وسم <application> في المانيفست
          sed -i '/<application[^>]*>/a \        <meta-data android:name="com.startapp.sdk.APPLICATION_ID" android:value="203477356" />' $MANIFEST
